<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milo · Dibujante e ilustrador</title>
<meta name="description" content="Portafolio y redes de Milo, dibujante e ilustrador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>

  <header>
    <h1>Milo</h1>
    <p class="globo">Hola soy Milo, bienvenido a mi portafolio!</p>
    <p class="profesion">soy dibujante e ilustrador</p>
  </header>

  <section aria-labelledby="titulo-mano">
    <h2 id="titulo-mano">Dibujos a mano</h2>
    <div class="paneles">
      <figure class="panel">
        <img src="dibujos/dibujo-1.jpg" alt="Dibujo a lápiz de un cuervo" width="919" height="1400" loading="lazy">
      </figure>
      <figure class="panel">
        <img src="dibujos/dibujo-2.jpg" alt="Dibujo a tinta de una mujer" width="819" height="1400" loading="lazy">
      </figure>
      <figure class="panel">
        <img src="dibujos/dibujo-3.jpg" alt="Página de cómic a tinta" width="815" height="1400" loading="lazy">
      </figure>
    </div>
  </section>

  <section aria-labelledby="titulo-digital">
    <h2 id="titulo-digital">Ilustraciones digitales</h2>
    <div class="paneles">
      <figure class="panel">
        <img src="dibujos/ilustracion-1.jpg" alt="Ilustración digital de una tortuga ninja" width="1050" height="1400" loading="lazy">
      </figure>
      <figure class="panel">
        <img src="dibujos/ilustracion-2.jpg" alt="Ilustración digital de un personaje de terror" width="912" height="1400" loading="lazy">
      </figure>
      <figure class="panel">
        <img src="dibujos/ilustracion-3.jpg" alt="Ilustración digital de un cuervo en blanco y negro" width="1024" height="930" loading="lazy">
      </figure>
    </div>
  </section>

  <section aria-labelledby="titulo-redes">
    <h2 id="titulo-redes">Sígueme en mis redes</h2>
    <div class="redes">
      <a class="boton" href="https://www.deviantart.com/TU_USUARIO" target="_blank" rel="noopener noreferrer">DeviantArt</a>
      <a class="boton" href="https://instagram.com/TU_USUARIO" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="boton" href="https://tiktok.com/@TU_USUARIO" target="_blank" rel="noopener noreferrer">TikTok</a>
    </div>
  </section>

  <footer>© 2026 Milo. Todos los dibujos son del autor.</footer>

</main>
</body>
</html>
